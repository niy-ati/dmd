name: Milestone 2 Header Catalog
on:
  workflow_dispatch:
  push:
    branches: [ milestone2-header-catalog ]

jobs:
  catalog:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    env:
      OS_NAME: ${{ startsWith(matrix.os, 'windows') && 'windows' || 'linux' }}
      MODEL: 64
      HOST_DMD: dmd
      FULL_BUILD: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Set N
        run: echo "N=$(nproc 2>/dev/null || echo 2)" >> $GITHUB_ENV

      - name: 'Posix: install prerequisites'
        if: runner.os != 'Windows'
        run: sudo -E ci/cirrusci.sh

      - name: 'Posix: install host compiler'
        if: runner.os != 'Windows'
        run: ci/run.sh install_host_compiler

      - name: 'Windows: install host compiler'
        if: runner.os == 'Windows'
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd

      - name: Set up repos
        run: ci/run.sh setup_repos master

      - name: Build dmd
        run: ci/run.sh build

      - name: 'Windows: set up MSVC environment'
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
        with:
          arch: x64

      - name: 'Linux: install zlib headers'
        if: runner.os != 'Windows'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: 'Windows: install zlib via vcpkg'
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows

      - name: Locate built dmd
        run: |
          DOTEXE=""
          if [ "$RUNNER_OS" == "Windows" ]; then DOTEXE=".exe"; fi
          DMD_BIN="generated/$OS_NAME/release/$MODEL/dmd$DOTEXE"
          if [ ! -f "$DMD_BIN" ]; then
            echo "Expected compiler not found at $DMD_BIN" >&2
            find generated -type f \( -iname 'dmd' -o -iname 'dmd.exe' \) >&2
            exit 1
          fi
          echo "DMD_BIN=$DMD_BIN" >> $GITHUB_ENV
          "$DMD_BIN" --version

      - name: 'Catalog: windows.h bare parse (baseline)'
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          cat > probe_windows_h.c << 'EOF'
          #include <windows.h>
          int main(void) { return 0; }
          EOF
          echo "=== ImportC parsing real MSVC windows.h (no intrinsic use) ===" > windows_h_catalog.log
          "$DMD_BIN" -c probe_windows_h.c 2>&1 | tee -a windows_h_catalog.log

      - name: 'Catalog: MSVC intrinsic usage (issue 20270)'
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          cat > probe_intrin.c << 'EOF'
          #include <intrin.h>
          int main(void) {
              long x = 0;
              _InterlockedExchangeAdd(&x, 1);
              return (int)x;
          }
          EOF
          echo "=== ImportC compiling real <intrin.h>, calling _InterlockedExchangeAdd (issue 20270) ===" > intrin_catalog.log
          "$DMD_BIN" -c probe_intrin.c 2>&1 | tee -a intrin_catalog.log

      - name: 'Catalog: __forceinline dead-code link test (issue 21266)'
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          cat > probe_forceinline.c << 'EOF'
          void i_do_not_exist(void);
          __forceinline void i_am_not_called(void){
              i_do_not_exist();
          }
          int main(void){ return 0; }
          EOF
          echo "=== ImportC compiling+linking __forceinline dead-code case (issue 21266) ===" > forceinline_catalog.log
          "$DMD_BIN" probe_forceinline.c -of=probe_forceinline.exe 2>&1 | tee -a forceinline_catalog.log
          if [ -f probe_forceinline.exe ]; then
            echo "RESULT: linked successfully (issue not reproduced on this dmd)" >> forceinline_catalog.log
          else
            echo "RESULT: failed to link (issue 21266 reproduced)" >> forceinline_catalog.log
          fi

      - name: 'Catalog: real zlib.h declarations (zlibVersion)'
        continue-on-error: true
        run: |
          cat > probe_zlib_h.c << 'EOF'
          #include <zlib.h>
          int main(void) {
              const char *v = zlibVersion();
              return v ? 0 : 1;
          }
          EOF
          echo "=== ImportC compiling real zlib.h, calling zlibVersion() ($OS_NAME) ===" > zlib_h_catalog.log
          if [ "$RUNNER_OS" == "Windows" ]; then
            ZLIB_H=$(find /c/vcpkg/installed -iname 'zlib.h' | head -1)
            if [ -z "$ZLIB_H" ]; then
              echo "Could not locate zlib.h under /c/vcpkg/installed" | tee -a zlib_h_catalog.log
              find /c/vcpkg/installed -maxdepth 3 >> zlib_h_catalog.log
            fi
            ZINC=$(dirname "$ZLIB_H")
            echo "Using zlib include dir: $ZINC" >> zlib_h_catalog.log
            "$DMD_BIN" -c -I"$ZINC" probe_zlib_h.c 2>&1 | tee -a zlib_h_catalog.log
          else
            "$DMD_BIN" -c probe_zlib_h.c 2>&1 | tee -a zlib_h_catalog.log
          fi

      - name: Print catalog summary
        if: always()
        run: |
          for f in windows_h_catalog.log intrin_catalog.log forceinline_catalog.log zlib_h_catalog.log; do
            echo "::group::$f"
            cat "$f" 2>/dev/null || echo "(not run on this OS)"
            echo "::endgroup::"
          done

      - name: Upload catalog logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-catalog-${{ matrix.os }}
          path: |
            windows_h_catalog.log
            intrin_catalog.log
            forceinline_catalog.log
            zlib_h_catalog.log
          if-no-files-found: ignore
